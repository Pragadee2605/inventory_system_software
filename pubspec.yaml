name: inventory_system_software
description: A professional Inventory Management System for Desktop.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  riverpod_annotation: ^2.6.0
  uuid: ^4.4.0
  logging: ^1.2.0
  intl: ^0.19.0
  dbcrypt: ^2.0.0
  collection: ^1.18.0
  file_picker: ^8.1.2
  csv: ^6.0.0
  material_design_icons_flutter: ^7.0.7296
  fl_chart: ^0.68.0
  webview_flutter: ^4.4.2
  webview_windows: ^0.3.0
  permission_handler: ^11.3.1
  mobile_scanner: ^5.1.1
  flutter_beep: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scanner/index.html
    - assets/scanner/worker-zxing.min.js
    - assets/scanner/loader.js
